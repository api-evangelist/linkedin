- aid: linkedin:linkedin-conversion-events-streaming-workflow-api
  name: LinkedIn Conversion Events Streaming Workflow API
  description: "1. Obtain user authorization with consent to create and manage conversions using `rw_conversions`,\
    \ `r_ads` permissions in the scope.\n2. Retrieve authenticated user's sponsored Ad Accounts where\
    \ user has a non-viewer user role.\n3. Ask the user to select one of their Ad Account where conversion\
    \ events would be streamed.\n4. Fetch existing Conversion Rules for CAPI in the selected Ad Account\n\
    5. Allow the user to choose if they want to create a new Conversion Rule or update an existing one\n\
    6. Create a new Conversion Rule (skip this step if the user chose to update an existing Conversion\
    \ Rule)\n7. Fetch active campaign URNs to associate with conversion rule\n8. Associate campaigns to\
    \ conversion rule for campaign attribution and optimization\n9. Stream conversion event to the conversion\
    \ rule\n    \n10. Stream multiple conversion events to the conversion rule"
  humanURL: https://learn.microsoft.com/en-us/linkedin/consumer/
  baseURL: https://api.linkedin.com
